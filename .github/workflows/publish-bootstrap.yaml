name: Publish bootstrap image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: bootstrap/go.mod

      - name: Test bootstrap
        working-directory: bootstrap
        run: go test -race ./...

      - name: Resolve image tags
        id: version
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "minor_tag=v${version%.*}" >> "${GITHUB_OUTPUT}"

      - name: Verify Compose references this release
        run: |
          grep -F "image: ghcr.io/kloudyuk/torrential-bootstrap:${{ steps.version.outputs.minor_tag }}" compose.yaml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing release image
        run: |
          if docker buildx imagetools inspect "ghcr.io/kloudyuk/torrential-bootstrap:${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "bootstrap image ${{ github.ref_name }} already exists" >&2
            exit 1
          fi

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ./bootstrap
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kloudyuk/torrential-bootstrap:${{ github.ref_name }}
            ghcr.io/kloudyuk/torrential-bootstrap:${{ steps.version.outputs.minor_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
