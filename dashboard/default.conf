server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve Compose service names when a request is made. Most application
    # containers intentionally start after the dashboard during onboarding.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $controller_url http://controller:8080;
        proxy_pass $controller_url;
        client_max_body_size 1k;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        access_log off;
    }
}
