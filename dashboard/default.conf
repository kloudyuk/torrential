server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve Compose service names when a request is made. Most application
    # containers intentionally start after the dashboard during onboarding.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health/seerr {
        set $health_url http://seerr:5055/api/v1/settings/public;
        proxy_pass $health_url;
        include /etc/nginx/health-proxy.conf;
    }

    location = /health/sonarr {
        set $health_url http://sonarr:8989/ping;
        proxy_pass $health_url;
        include /etc/nginx/health-proxy.conf;
    }

    location = /health/radarr {
        set $health_url http://radarr:7878/ping;
        proxy_pass $health_url;
        include /etc/nginx/health-proxy.conf;
    }

    location = /health/prowlarr {
        set $health_url http://prowlarr:9696/ping;
        proxy_pass $health_url;
        include /etc/nginx/health-proxy.conf;
    }

    location = /health/transmission {
        set $health_url http://transmission:9091/transmission/web/;
        proxy_pass $health_url;
        include /etc/nginx/health-proxy.conf;
    }

    location = /health/plex {
        set $health_url http://plex:32400/identity;
        proxy_pass $health_url;
        include /etc/nginx/health-proxy.conf;
    }
}
