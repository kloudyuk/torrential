name: torrential

x-linuxserver-environment: &linuxserver-environment
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Etc/UTC}

services:
  dashboard:
    # Nginx 1.31 on Alpine
    image: nginx:1.31-alpine
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /usr/share/nginx/html
      SEERR_PORT: ${SEERR_PORT:-5055}
      PLEX_PORT: ${PLEX_PORT:-32400}
      SONARR_PORT: ${SONARR_PORT:-8989}
      RADARR_PORT: ${RADARR_PORT:-7878}
      PROWLARR_PORT: ${PROWLARR_PORT:-9696}
      TRANSMISSION_PORT: ${TRANSMISSION_PORT:-9091}
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${DASHBOARD_PORT:-80}:80"
    volumes:
      - ./dashboard/index.html.template:/etc/nginx/templates/index.html.template:ro
      - ./dashboard/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./assets/icons:/usr/share/nginx/html/icons:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  gluetun:
    # Gluetun 3.41. Transmission, Prowlarr, and Byparr share this
    # network namespace so they have no non-VPN egress path.
    image: qmcgaw/gluetun:v3.41
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-nordvpn}
      VPN_TYPE: openvpn
      OPENVPN_USER: ${OPENVPN_USER:?Set OPENVPN_USER to your VPN service username}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:?Set OPENVPN_PASSWORD to your VPN service password}
      OPENVPN_PROTOCOL: ${OPENVPN_PROTOCOL:-udp}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-United Kingdom}
      UPDATER_PERIOD: 480h
      TZ: ${TZ:-Etc/UTC}
      FIREWALL_INPUT_PORTS: "9091,9696"
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${TRANSMISSION_PORT:-9091}:9091"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${PROWLARR_PORT:-9696}:9696"
    volumes:
      - ${CONFIG_ROOT:-./state/config}/gluetun:/gluetun
    depends_on:
      bootstrap:
        condition: service_started
    networks:
      default:
        aliases:
          - transmission
          - prowlarr

  init:
    # One-shot filesystem initialization using Torrential runtime 1.0.
    image: ghcr.io/kloudyuk/torrential-bootstrap:v1.0.0
    restart: "no"
    user: "0:0"
    command: ["prepare"]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      LOCALE: ${LOCALE:-en-GB}
      TORRENTIAL_HOST: ${TORRENTIAL_HOST:?Set TORRENTIAL_HOST to the Docker host LAN IP or local DNS name}
    volumes:
      - ${CONFIG_ROOT:-./state/config}:/config
      - ${DATA_ROOT:-./state/data}:/data
    network_mode: "none"
    healthcheck:
      disable: true

  bootstrap:
    # One-shot configuration coordinator using Torrential runtime 1.0.
    image: ghcr.io/kloudyuk/torrential-bootstrap:v1.0.0
    restart: "no"
    user: "0:0"
    network_mode: "service:plex"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      LOCALE: ${LOCALE:-en-GB}
      TORRENTIAL_HOST: ${TORRENTIAL_HOST:?Set TORRENTIAL_HOST to the Docker host LAN IP or local DNS name}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-80}
      BOOTSTRAP_REQUEST_TIMEOUT_MS: ${BOOTSTRAP_REQUEST_TIMEOUT_MS:-90000}
      BOOTSTRAP_STARTUP_TIMEOUT_MS: ${BOOTSTRAP_STARTUP_TIMEOUT_MS:-300000}
      SONARR_URL: http://sonarr:8989
      RADARR_URL: http://radarr:7878
      PROWLARR_URL: http://prowlarr:9696
      TRANSMISSION_RPC_URL: http://transmission:9091/transmission/rpc
      PLEX_URL: http://127.0.0.1:32400
      PLEX_CONFIG_FILE: /config/plex/Library/Application Support/Plex Media Server/Preferences.xml
      PLEX_NOTIFICATION_URL: http://plex:32400
      SEERR_URL: http://seerr:5055
      SEERR_CONFIG_FILE: /config/seerr/settings.json
      SEERR_SONARR_QUALITY_PROFILE: ${SEERR_SONARR_QUALITY_PROFILE:-HD-1080p}
      SEERR_RADARR_QUALITY_PROFILE: ${SEERR_RADARR_QUALITY_PROFILE:-HD-1080p}
    volumes:
      - ${CONFIG_ROOT:-./state/config}:/config
      - ${DATA_ROOT:-./state/data}:/data
    depends_on:
      dashboard:
        condition: service_healthy
      init:
        condition: service_completed_successfully
      plex:
        condition: service_started
    healthcheck:
      disable: true

  controller:
    # Long-running, allowlisted Docker status and restart controller.
    image: ghcr.io/kloudyuk/torrential-bootstrap:v1.0.0
    command: ["controller"]
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
      TORRENTIAL_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-torrential}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/bootstrap", "probe"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

  sonarr:
    # Sonarr 4.0.19 (the narrowest stable tag published upstream)
    image: lscr.io/linuxserver/sonarr:4.0.19
    restart: unless-stopped
    environment:
      <<: *linuxserver-environment
      SONARR__AUTH__METHOD: External
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${SONARR_PORT:-8989}:8989"
    volumes:
      - ${CONFIG_ROOT:-./state/config}/sonarr:/config
      - ${DATA_ROOT:-./state/data}:/data
    depends_on:
      bootstrap:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8989/ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  radarr:
    # Radarr 6.3.0 (the narrowest stable tag published upstream)
    image: lscr.io/linuxserver/radarr:6.3.0
    restart: unless-stopped
    environment:
      <<: *linuxserver-environment
      RADARR__AUTH__METHOD: External
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${RADARR_PORT:-7878}:7878"
    volumes:
      - ${CONFIG_ROOT:-./state/config}/radarr:/config
      - ${DATA_ROOT:-./state/data}:/data
    depends_on:
      bootstrap:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:7878/ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  seerr:
    # Seerr 3.4
    image: ghcr.io/seerr-team/seerr:v3.4
    init: true
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      LOG_LEVEL: ${SEERR_LOG_LEVEL:-info}
      PORT: 5055
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${SEERR_PORT:-5055}:5055"
    volumes:
      - ${CONFIG_ROOT:-./state/config}/seerr:/app/config
    depends_on:
      bootstrap:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 6

  plex:
    # Plex Media Server 1.43.0.10492-121068a07
    image: plexinc/pms-docker:1.43.0.10492-121068a07
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /etc/cont-init.d/45-torrential-preferences <<'SCRIPT'
        #!/usr/bin/with-contenv bash
        set -e

        preferences="/config/Library/Application Support/Plex Media Server/Preferences.xml"

        set_preference() {
          name=$$1
          value=$$2
          count=$$(xmlstarlet sel -T -t -v "count(/Preferences/@$${name})" "$$preferences")
          if [ "$$count" -gt 0 ]; then
            xmlstarlet ed --inplace --update "/Preferences/@$${name}" -v "$$value" "$$preferences"
          else
            xmlstarlet ed --inplace --insert /Preferences --type attr -n "$$name" -v "$$value" "$$preferences"
          fi
        }

        set_preference AcceptedEULA 1
        set_preference FirstRun 0
        SCRIPT
        chmod 755 /etc/cont-init.d/45-torrential-preferences &&
        exec /init
    hostname: ${PLEX_HOSTNAME:-torrential-plex}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      PLEX_UID: ${PUID:-1000}
      PLEX_GID: ${PGID:-1000}
      ADVERTISE_IP: "http://${TORRENTIAL_HOST:?Set TORRENTIAL_HOST to the Docker host LAN IP or local DNS name}:${PLEX_PORT:-32400}/"
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${PLEX_PORT:-32400}:32400/tcp"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:8324:8324/tcp"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:32469:32469/tcp"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:1900:1900/udp"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:32410:32410/udp"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:32412:32412/udp"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:32413:32413/udp"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:32414:32414/udp"
    volumes:
      - ${CONFIG_ROOT:-./state/config}/plex:/config
      - ${DATA_ROOT:-./state/data}/transcode:/transcode
      - ${DATA_ROOT:-./state/data}/media:/data/media:ro
    depends_on:
      init:
        condition: service_completed_successfully
  prowlarr:
    # Prowlarr 2.5.2 (the narrowest stable tag published upstream)
    image: lscr.io/linuxserver/prowlarr:2.5.2
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      <<: *linuxserver-environment
      PROWLARR__AUTH__METHOD: External
      PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - ${CONFIG_ROOT:-./state/config}/prowlarr:/config
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9696/ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  byparr:
    # Byparr does not publish floating major/minor tags; latest tracks stable releases.
    image: ghcr.io/thephaseless/byparr:latest
    restart: unless-stopped
    network_mode: "service:gluetun"
    shm_size: 512m
    environment:
      TZ: ${TZ:-Etc/UTC}
      LOG_LEVEL: ${BYPARR_LOG_LEVEL:-info}
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8191/health"]
      interval: 5m
      timeout: 30s
      start_period: 20s
      retries: 3

  transmission:
    # Transmission 4.1.3 (the narrowest stable tag published upstream)
    image: lscr.io/linuxserver/transmission:4.1.3
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      <<: *linuxserver-environment
    volumes:
      - ${CONFIG_ROOT:-./state/config}/transmission:/config
      - ${DATA_ROOT:-./state/data}:/data
      # Safety for Transmission's image defaults before the first-run /data path change.
      - ${DATA_ROOT:-./state/data}/torrents:/downloads
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9091/transmission/web/"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
