name: torrential

x-linuxserver-environment: &linuxserver-environment
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Etc/UTC}

services:
  dashboard:
    # Nginx 1.31.4 on Alpine 3.24
    image: nginx:1.31.4-alpine3.24@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /usr/share/nginx/html
      SEERR_PORT: ${SEERR_PORT:-5055}
      PLEX_PORT: ${PLEX_PORT:-32400}
      SONARR_PORT: ${SONARR_PORT:-8989}
      RADARR_PORT: ${RADARR_PORT:-7878}
      PROWLARR_PORT: ${PROWLARR_PORT:-9696}
      TRANSMISSION_PORT: ${TRANSMISSION_PORT:-9091}
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${DASHBOARD_PORT:-80}:80"
    volumes:
      - ./dashboard/index.html.template:/etc/nginx/templates/index.html.template:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  gluetun:
    # Gluetun 3.41.1. Transmission, Prowlarr, and FlareSolverr share this
    # network namespace so they have no non-VPN egress path.
    image: qmcgaw/gluetun:v3.41.1@sha256:1a5bf4b4820a879cdf8d93d7ef0d2d963af56670c9ebff8981860b6804ebc8ab
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-nordvpn}
      VPN_TYPE: openvpn
      OPENVPN_USER: ${OPENVPN_USER:?Set OPENVPN_USER to your VPN service username}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:?Set OPENVPN_PASSWORD to your VPN service password}
      OPENVPN_PROTOCOL: ${OPENVPN_PROTOCOL:-udp}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-United Kingdom}
      TZ: ${TZ:-Etc/UTC}
      FIREWALL_INPUT_PORTS: "9091,9696"
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${TRANSMISSION_PORT:-9091}:9091"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${PROWLARR_PORT:-9696}:9696"
    volumes:
      - ${CONFIG_ROOT:-./state/config}/gluetun:/gluetun
    networks:
      default:
        aliases:
          - transmission
          - prowlarr

  bootstrap:
    build:
      context: ./bootstrap
    image: torrential-bootstrap:dev
    restart: "no"
    user: "0:0"
    network_mode: "service:plex"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      BOOTSTRAP_REQUEST_TIMEOUT_MS: ${BOOTSTRAP_REQUEST_TIMEOUT_MS:-15000}
      SONARR_URL: http://sonarr:8989
      RADARR_URL: http://radarr:7878
      PROWLARR_URL: http://prowlarr:9696
      TRANSMISSION_RPC_URL: http://transmission:9091/transmission/rpc
      PLEX_URL: http://127.0.0.1:32400
      PLEX_CONFIG_FILE: /plex-config/Library/Application Support/Plex Media Server/Preferences.xml
      PLEX_LIBRARY_LANGUAGE: ${PLEX_LIBRARY_LANGUAGE:-en-US}
      SEERR_URL: http://seerr:5055
      SEERR_CONFIG_FILE: /service-config/seerr/settings.json
      SEERR_SONARR_QUALITY_PROFILE: ${SEERR_SONARR_QUALITY_PROFILE:-HD-1080p}
      SEERR_RADARR_QUALITY_PROFILE: ${SEERR_RADARR_QUALITY_PROFILE:-HD-1080p}
    volumes:
      - ${CONFIG_ROOT:-./state/config}/sonarr:/arr-config/sonarr:ro
      - ${CONFIG_ROOT:-./state/config}/radarr:/arr-config/radarr:ro
      - ${CONFIG_ROOT:-./state/config}/prowlarr:/arr-config/prowlarr:ro
      - ${CONFIG_ROOT:-./state/config}/plex:/plex-config:ro
      - ${CONFIG_ROOT:-./state/config}/seerr:/service-config/seerr:ro
      - ${DATA_ROOT:-./state/data}:/data
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
      flaresolverr:
        condition: service_healthy
      transmission:
        condition: service_healthy
      plex:
        condition: service_healthy
      seerr:
        condition: service_healthy
    healthcheck:
      disable: true

  sonarr:
    # Sonarr 4.0.19.2979-ls322
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls322@sha256:c19aa4ecdf03d73e1d5c901da33744cb7eb4d921f89bafed1ca264601d7fa224
    restart: unless-stopped
    environment:
      <<: *linuxserver-environment
      SONARR__AUTH__METHOD: External
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${SONARR_PORT:-8989}:8989"
    volumes:
      - ${CONFIG_ROOT:-./state/config}/sonarr:/config
      - ${DATA_ROOT:-./state/data}:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8989/ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  radarr:
    # Radarr 6.3.0.10514-ls314
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls314@sha256:119aaa4a4f7349bcd2a136c5373a0d7925b5479915c7dfe0c0ad352db2a6d438
    restart: unless-stopped
    environment:
      <<: *linuxserver-environment
      RADARR__AUTH__METHOD: External
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${RADARR_PORT:-7878}:7878"
    volumes:
      - ${CONFIG_ROOT:-./state/config}/radarr:/config
      - ${DATA_ROOT:-./state/data}:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:7878/ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  seerr:
    # Seerr 3.4.1
    image: ghcr.io/seerr-team/seerr:v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
    init: true
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      LOG_LEVEL: ${SEERR_LOG_LEVEL:-info}
      PORT: 5055
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${SEERR_PORT:-5055}:5055"
    volumes:
      - ${CONFIG_ROOT:-./state/config}/seerr:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 6

  plex:
    # Plex Media Server 1.43.0.10492-121068a07
    image: plexinc/pms-docker:1.43.0.10492-121068a07@sha256:1131c4cd21fa22f8196f749f1dbb69af306776c3c83c7f5b061e51dc49bcff7f
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /etc/cont-init.d/45-torrential-preferences <<'SCRIPT'
        #!/usr/bin/with-contenv bash
        set -e

        preferences="/config/Library/Application Support/Plex Media Server/Preferences.xml"

        set_preference() {
          name=$$1
          value=$$2
          count=$$(xmlstarlet sel -T -t -v "count(/Preferences/@$${name})" "$$preferences")
          if [ "$$count" -gt 0 ]; then
            xmlstarlet ed --inplace --update "/Preferences/@$${name}" -v "$$value" "$$preferences"
          else
            xmlstarlet ed --inplace --insert /Preferences --type attr -n "$$name" -v "$$value" "$$preferences"
          fi
        }

        set_preference AcceptedEULA 1
        set_preference FirstRun 0
        SCRIPT
        chmod 755 /etc/cont-init.d/45-torrential-preferences &&
        exec /init
    hostname: ${PLEX_HOSTNAME:-torrential-plex}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      PLEX_UID: ${PUID:-1000}
      PLEX_GID: ${PGID:-1000}
      ADVERTISE_IP: ${PLEX_ADVERTISE_URL:-}
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${PLEX_PORT:-32400}:32400/tcp"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:8324:8324/tcp"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:32469:32469/tcp"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:1900:1900/udp"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:32410:32410/udp"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:32412:32412/udp"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:32413:32413/udp"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:32414:32414/udp"
    volumes:
      - ${CONFIG_ROOT:-./state/config}/plex:/config
      - ${DATA_ROOT:-./state/data}/transcode:/transcode
      - ${DATA_ROOT:-./state/data}/media:/data/media:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:32400/identity >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 12

  prowlarr:
    # Prowlarr 2.5.2.5491-ls157
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls157@sha256:ab91301778251f82a31bbfc87f0497376d59e84439d9a1ceff6a61d594d1e3d7
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      <<: *linuxserver-environment
      PROWLARR__AUTH__METHOD: External
      PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - ${CONFIG_ROOT:-./state/config}/prowlarr:/config
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9696/ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  flaresolverr:
    # FlareSolverr 3.5.0; internal Prowlarr indexer proxy with no host port.
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      TZ: ${TZ:-Etc/UTC}
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      LOG_HTML: "false"
    volumes:
      - ${CONFIG_ROOT:-./state/config}/flaresolverr:/config
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  transmission:
    # Transmission 4.1.3-r0-ls359
    image: lscr.io/linuxserver/transmission:4.1.3-r0-ls359@sha256:c85eb732f0ae9e4152b76c2d7da26e50c1fb54c05d9723800c198385ff66c247
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      <<: *linuxserver-environment
    volumes:
      - ${CONFIG_ROOT:-./state/config}/transmission:/config
      - ${DATA_ROOT:-./state/data}:/data
      # Safety for Transmission's image defaults before the first-run /data path change.
      - ${DATA_ROOT:-./state/data}/torrents:/downloads
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9091/transmission/web/"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
